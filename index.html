    <link id="dynamic-apple-favicon" rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        try {
          var fav = localStorage.getItem('zed_setting_app_favicon_url') || localStorage.getItem('zed_setting_favicon_url');
          if (fav) {
            var icon = document.getElementById('dynamic-favicon');
            var appleIcon = document.getElementById('dynamic-apple-favicon');
            if (icon) icon.href = fav;
            if (appleIcon) appleIcon.href = fav;
          }
        } catch(e) {}
      })();
    </script>
    <!-- Android Viewport Transformation & Layout Scaling Script -->
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || navigator.vendor || window.opera;
          var isAndroid = /android/i.test(ua);
          if (isAndroid) {
            document.documentElement.classList.add('is-android-device');
            function applyAndroidViewportFit() {
              var root = document.getElementById('root');
              if (!root) return;
              var screenWidth = window.innerWidth || document.documentElement.clientWidth;
              if (screenWidth < 480 && screenWidth > 0) {
                root.style.transformOrigin = 'top center';
                root.style.width = '100%';
                root.style.maxWidth = '100vw';
                root.style.overflowX = 'hidden';
                root.style.overflowY = 'visible';
                document.documentElement.style.overflowY = 'auto';
                document.body.style.overflowY = 'auto';
              }
            }
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', applyAndroidViewportFit);
            } else {
              applyAndroidViewportFit();
            }
            window.addEventListener('resize', applyAndroidViewportFit);
            window.addEventListener('orientationchange', applyAndroidViewportFit);
          }
        } catch(e) {}
      })();
    </script>
